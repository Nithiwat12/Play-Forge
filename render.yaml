services:
  # Backend: Node/Express/Socket.IO server
  - type: web
    name: board-game-platform-server
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # paste your Neon pooled connection string
      - key: DIRECT_URL
        sync: false # paste your Neon direct (non -pooler) connection string
      - key: JWT_SECRET
        sync: false # paste a long random string
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: COOKIE_NAME
        value: bgp_token
      - key: CLIENT_ORIGIN
        sync: false # set to the client static site URL, e.g. https://board-game-platform-client.onrender.com

  # Frontend: Vite/React static build
  - type: web
    name: board-game-platform-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false # set to the server URL + /api, e.g. https://board-game-platform-server.onrender.com/api
      - key: VITE_SOCKET_URL
        sync: false # set to the server URL, e.g. https://board-game-platform-server.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
